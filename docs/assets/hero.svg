<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-label="CyberSaarthi intelligence pipeline: Evidence to Findings">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0a12"/>
      <stop offset="55%" stop-color="#120f1d"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="620" rx="20" fill="url(#bg)"/>

  <!-- soft ambient glows -->
  <circle cx="90" cy="90" r="140" fill="#8b5cf6" opacity="0.10" filter="url(#glow)"/>
  <circle cx="640" cy="540" r="160" fill="#22d3ee" opacity="0.08" filter="url(#glow)"/>

  <!-- header -->
  <text x="360" y="52" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e9e5f5" letter-spacing="4">CYBERSAARTHI</text>
  <text x="360" y="74" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b83a8" letter-spacing="1">INVESTIGATION INTELLIGENCE</text>

  <!-- vertical spine -->
  <line x1="360" y1="110" x2="360" y2="540" stroke="#3a3350" stroke-width="2" stroke-dasharray="2 6"/>

  <g>
    <!-- Evidence -->
    <circle cx="360" cy="140" r="26" fill="url(#violet)" filter="url(#glow)"/>
    <text x="360" y="146" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#0c0a12" font-weight="700">📄</text>
    <text x="420" y="136" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#f4f2fb">Evidence</text>
    <text x="420" y="154" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9a93bd">raw files · provenance preserved</text>

    <!-- Entity Resolution -->
    <circle cx="360" cy="230" r="26" fill="url(#cyan)" filter="url(#glow)"/>
    <text x="360" y="236" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#06222a" font-weight="700">🧩</text>
    <text x="420" y="226" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#f4f2fb">Entity Resolution</text>
    <text x="420" y="244" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9a93bd">aliases collapsed deterministically</text>

    <!-- Knowledge Graph -->
    <circle cx="360" cy="320" r="26" fill="url(#violet)" filter="url(#glow)"/>
    <text x="360" y="326" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#0c0a12" font-weight="700">🕸️</text>
    <text x="420" y="316" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#f4f2fb">Knowledge Graph</text>
    <text x="420" y="334" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9a93bd">case-scoped Neo4j projection</text>

    <!-- Analytics -->
    <circle cx="360" cy="410" r="26" fill="url(#cyan)" filter="url(#glow)"/>
    <text x="360" y="416" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#06222a" font-weight="700">📊</text>
    <text x="420" y="406" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#f4f2fb">Analytics</text>
    <text x="420" y="424" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9a93bd">deterministic · reproducible · auditable</text>

    <!-- Findings -->
    <circle cx="360" cy="500" r="26" fill="url(#pink)" filter="url(#glow)"/>
    <text x="360" y="506" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#2a0f1c" font-weight="700">💡</text>
    <text x="420" y="496" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#f4f2fb">Findings</text>
    <text x="420" y="514" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9a93bd">explainable · human-reviewed signals</text>
  </g>

  <!-- footer -->
  <text x="360" y="586" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#22d3ee" filter="url(#glow)">Evidence → Intelligence → Knowledge → Insight</text>
</svg>
