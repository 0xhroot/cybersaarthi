name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit-tests:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Deterministically install runtime + dev dependencies from backend/uv.lock
      # with the same package manager (uv) used by the Docker `dev` build target.
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format (ruff format --check)
        run: uv run ruff format --check .

      - name: Typecheck (mypy)
        run: uv run mypy app

      - name: Unit tests (no infrastructure)
        run: uv run pytest tests/unit -q
