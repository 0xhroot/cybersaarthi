name: cybersaarthi

# Shared environment so the runtime backend and the dev/tooling backend see the
# same infrastructure addresses (PostgreSQL/Neo4j/Redis/MinIO by service name).
x-backend-env: &backend-env
  APP_NAME: ${APP_NAME:-cybersaarthi}
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-cybersaarthi}
  POSTGRES_USER: ${POSTGRES_USER:-cybersaarthi}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybersaarthi}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-cybersaarthi}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cybersaarthi}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-cybersaarthi}
  S3_BUCKET: ${S3_BUCKET:-cybersaarthi}
  S3_REGION: ${S3_REGION:-us-east-1}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
  SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}

services:
  backend:
    build:
      context: ./backend
    working_dir: /app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Development/verification backend: contains pytest/ruff/mypy on top of the
  # full runtime. Runs only on demand via `make test|lint|format-check|typecheck`
  # (docker compose run). Not started by `docker compose up -d`.
  backend-dev:
    build:
      context: ./backend
      target: dev
    profiles: ["dev"]
    working_dir: /src
    environment:
      <<: *backend-env
      CYBERSAARTHI_REPO_ROOT: /repo
    volumes:
      - ./backend:/src
      - .:/repo:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cybersaarthi}
      POSTGRES_USER: ${POSTGRES_USER:-cybersaarthi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybersaarthi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    ulimits:
      nofile:
        soft: 1024
        hard: 1024

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-cybersaarthi}
      # Allow short dev passwords (NEO4J_* maps to dbms.security.auth_minimum_password_length).
      NEO4J_dbms_security_auth__minimum__password__length: "1"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-cybersaarthi} 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-cybersaarthi}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-cybersaarthi}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-cybersaarthi}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-cybersaarthi}
      S3_BUCKET: ${S3_BUCKET:-cybersaarthi}
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/$$S3_BUCKET",
      ]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  minio_data: